<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo編集確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <h1 class="page-title">Todo編集確認</h1>

    <div class="confirm-value">
        <p>やること：<span th:text="${todo.title != null && todo.title != '' ? todo.title : '（入力なし）'}"></span></p>
        <p>メモ：<span th:text="${todo.detail != null && todo.detail != '' ? todo.detail : '（入力なし）'}"></span></p>
        <p>ジャンル：<span th:text="${todo.category != null && todo.category != '' ? todo.category : '（入力なし）'}"></span></p>
        <p>優先度：<span th:text="${todo.priority == 1 ? '高' : todo.priority == 2 ? '中' : todo.priority == 3 ? '低' : '（入力なし）'}"></span></p>
        <p>期限：<span th:text="${todo.dueDate != null ? todo.dueDate : '（入力なし）'}"></span></p>
        <p>完了：<span th:text="${todo.completed != null ? (todo.completed ? '完了' : '未完了') : '（入力なし）'}"></span></p>
    </div>

    <form th:action="@{/todos/{id}(id=${todo.id})}" method="post">
        <input type="hidden" name="id" th:value="${todo.id}">
        <input type="hidden" name="title" th:value="${todo.title}">
        <input type="hidden" name="detail" th:value="${todo.detail}">
        <input type="hidden" name="category" th:value="${todo.category}">
        <input type="hidden" name="priority" th:value="${todo.priority}">
        <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
        <input type="hidden" name="completed" th:value="${todo.completed}">
        <div class="confirm-actions">
            <button class="btn" type="submit">保存する</button>
        </div>
    </form>

    <form th:action="@{/todos/{id}/edit(id=${todo.id})}" method="post">
        <input type="hidden" name="id" th:value="${todo.id}">
        <input type="hidden" name="title" th:value="${todo.title}">
        <input type="hidden" name="detail" th:value="${todo.detail}">
        <input type="hidden" name="category" th:value="${todo.category}">
        <input type="hidden" name="priority" th:value="${todo.priority}">
        <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
        <input type="hidden" name="completed" th:value="${todo.completed}">
        <div class="confirm-actions">
            <button class="btn sub" type="submit">書き直す</button>
        </div>
    </form>
</main>
</body>
</html>
