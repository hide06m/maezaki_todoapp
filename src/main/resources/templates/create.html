<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo登録</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <h1 class="page-title">Todo登録</h1>

    <form action="/todos/confirm" method="post">
        <div class="form-row">
            <label class="form-label" for="title">やること</label>
            <input class="form-input" type="text" id="title" name="title" th:value="${todo.title}">
        </div>

        <div class="form-row">
            <label class="form-label" for="detail">メモ</label>
            <input class="form-input" type="text" id="detail" name="detail" th:value="${todo.detail}">
        </div>

        <div class="form-row">
            <label class="form-label" for="category">ジャンル</label>
            <select class="form-input" id="category" name="category">
                <option value=""></option>
                <option value="デザイン" th:selected="${todo.category == 'デザイン'}">デザイン</option>
                <option value="マーケティング" th:selected="${todo.category == 'マーケティング'}">マーケティング</option>
                <option value="プログラミング" th:selected="${todo.category == 'プログラミング'}">プログラミング</option>
                <option value="資格" th:selected="${todo.category == '資格'}">資格</option>
                <option value="就職活動" th:selected="${todo.category == '就職活動'}">就職活動</option>
            </select>
        </div>

        <div class="form-row">
            <label class="form-label" for="priority">優先度</label>
            <select class="form-input" id="priority" name="priority">
                <option value=""></option>
                <option value="1" th:selected="${todo.priority == 1}">高</option>
                <option value="2" th:selected="${todo.priority == 2}">中</option>
                <option value="3" th:selected="${todo.priority == 3}">低</option>
            </select>
        </div>

        <div class="form-row">
            <label class="form-label" for="dueDate">期限</label>
            <input class="form-input" type="date" id="dueDate" name="dueDate" th:value="${todo.dueDate}">
        </div>

        <div class="confirm-actions">
            <button class="btn" type="submit">確認する</button>
            <a class="btn sub" href="/todos">一覧へ</a>
        </div>
    </form>
</main>
</body>
</html>
