<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <h1 class="page-title">Todo一覧</h1>

    <p class="flash" th:if="${message}" th:text="${message}"></p>

    <p><a class="link" href="/todos/new">新規登録</a></p>

    <table class="list-table" th:if="${!todos.isEmpty()}">
        <thead>
        <tr>
            <th>やること</th>
            <th>ジャンル</th>
            <th>優先度</th>
            <th>期限</th>
            <th>状態</th>
            <th>編集</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="todo : ${todos}">
            <td th:text="${todo.title}"></td>
            <td th:text="${todo.category}"></td>
            <td th:text="${todo.priority == 1 ? '高' : todo.priority == 2 ? '中' : '低'}"></td>
            <td th:text="${todo.dueDate}"></td>
            <td th:text="${todo.completed ? '完了' : '未完了'}"></td>
            <td><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a></td>
        </tr>
        </tbody>
    </table>

    <p class="empty-message" th:if="${todos.isEmpty()}">まだ1件も登録されていません</p>
</main>
</body>
</html>
