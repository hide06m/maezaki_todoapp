<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <h1 class="page-title">Todo一覧</h1>

    <p class="flash" th:if="${message}" th:text="${message}"></p>

    <form action="/todos" method="get">
        <p>
            <label for="keyword">やることの名前</label>
            <input type="text" id="keyword" name="keyword" th:value="${keyword}">
        </p>
        <p>
            <label for="category">ジャンル</label>
            <select id="category" name="category">
                <option value="すべて" th:selected="${selectedCategory == null || selectedCategory == '' || selectedCategory == 'すべて'}">すべて</option>
                <option value="デザイン" th:selected="${selectedCategory == 'デザイン'}">デザイン</option>
                <option value="マーケティング" th:selected="${selectedCategory == 'マーケティング'}">マーケティング</option>
                <option value="プログラミング" th:selected="${selectedCategory == 'プログラミング'}">プログラミング</option>
                <option value="資格" th:selected="${selectedCategory == '資格'}">資格</option>
                <option value="就職活動" th:selected="${selectedCategory == '就職活動'}">就職活動</option>
            </select>
        </p>
        <input type="hidden" name="order" th:value="${order}">
        <p>
            <button type="submit">絞り込む</button>
        </p>
    </form>

    <p>
        <a class="link" th:href="@{/todos(order='asc', keyword=${keyword}, category=${selectedCategory})}">期限が近い順</a>
        <a class="link" th:href="@{/todos(order='desc', keyword=${keyword}, category=${selectedCategory})}">期限が遠い順</a>
    </p>

    <p><a class="link" href="/todos/new">新規登録</a></p>

    <table class="list-table" th:if="${!todos.isEmpty()}">
        <thead>
        <tr>
            <th>やること</th>
            <th>ジャンル</th>
            <th>優先度</th>
            <th>期限</th>
            <th>状態</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="todo : ${todos}">
            <td th:text="${todo.title}"></td>
            <td th:text="${todo.category}"></td>
            <td th:text="${todo.priority == 1 ? '高' : todo.priority == 2 ? '中' : '低'}"></td>
            <td th:text="${todo.dueDate}"></td>
            <td th:text="${todo.completed ? '完了' : '未完了'}"></td>
            <td>
                <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="empty-message" th:if="${todos.isEmpty()}">まだ1件も登録されていません</p>
</main>
</body>
</html>
