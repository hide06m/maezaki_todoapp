<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>削除確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="main">
    <div class="container">
        <h1>削除確認</h1>
        <p>この予定を消しますか。</p>
        <div class="detail">
            <p>やること: <span th:text="${todo.title}"></span></p>
            <p>ジャンル: <span th:text="${todo.category}"></span></p>
            <p>期限: <span th:text="${todo.dueDate}"></span></p>
        </div>
        <div class="button-area">
            <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                <button type="submit">消す</button>
            </form>
            <a th:href="@{/todos}">やめる</a>
        </div>
    </div>
</main>
</body>
</html>
